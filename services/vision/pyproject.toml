[project]
name = "vision-worker"
version = "0.1.0"
description = "Vision embedding worker for product catalog retrieval"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pillow>=10.4,<12",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107",
  "COM812",
  "ISC001",
  "PLR2004",
]

[tool.basedpyright]
typeCheckingMode = "all"
reportAny = true
reportImplicitRelativeImport = "error"
reportMissingTypeStubs = "warning"
