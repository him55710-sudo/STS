<!-- @dsCard group="Components" -->
<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;padding:24px;background:#dcd9d3;font-family:"Pretendard Variable",Pretendard,Inter,-apple-system,sans-serif;display:flex;justify-content:center}
  .sheet{width:330px;background:#fff;border-radius:22px 22px 0 0;border:1px solid #e7e9ec;border-bottom:none;padding:8px 20px 20px;box-shadow:0 -8px 32px rgba(17,18,20,.10)}
  .handle{width:36px;height:4px;border-radius:99px;background:#e7e9ec;margin:0 auto 14px}
  .row{display:flex;gap:14px}
  .img{width:88px;height:88px;border-radius:10px;background:linear-gradient(150deg,#e3e0da,#cfccc5);border:1px solid #e7e9ec}
  .badge{background:#eeefed;border-radius:5px;font-size:10px;font-weight:700;padding:2px 6px}
  .aff{background:#efecf5;color:#5b556e;border-radius:5px;font-size:10px;font-weight:700;padding:2px 6px}
  .cta{height:46px;border:none;border-radius:11px;background:#5b556e;color:#fff;font-size:15px;font-weight:700;width:100%;margin-top:14px}
  .wish{height:42px;border-radius:11px;background:#fff;border:1px solid #e7e9ec;color:#111214;font-size:14px;font-weight:600;width:100%;margin-top:8px}
  .sw{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:#6b6f76}
  .c{width:20px;height:20px;border-radius:50%;border:1px solid #e7e9ec}
</style>
<div class="sheet">
  <div class="handle"></div>
  <div class="row">
    <div class="img"></div>
    <div>
      <span style="font-size:12px;color:#6b6f76">Dr. Martens</span>
      <span class="badge">동일 상품</span>
      <p style="margin:2px 0;font-size:16px;font-weight:700">1461 스무스 블랙</p>
      <p style="margin:0;font-size:16px;font-weight:700">₩195,000</p>
      <p style="margin:2px 0 0;font-size:11px;color:#6b6f76">닥터마틴 공식몰 <span class="aff">제휴 6%</span></p>
    </div>
  </div>
  <div class="sw">색상 <span class="c" style="background:#111214;box-shadow:0 0 0 2px #fff,0 0 0 3px #111214"></span><span class="c" style="background:#b9afa3"></span><span class="c" style="background:#efefed"></span></div>
  <button class="cta">구매하러 가기 ↗</button>
  <button class="wish">🔖 위시리스트에 저장</button>
  <p style="margin:10px 0 0;text-align:center;font-size:10px;color:#6b6f76">제휴 파트너 상품 — 구매 시 수수료의 70%가 크리에이터에게 돌아가요.</p>
</div>
