<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;padding:24px;background:#f7f7f6;font-family:"Pretendard Variable",Pretendard,Inter,-apple-system,sans-serif;display:flex;flex-direction:column;gap:14px;max-width:380px}
  .search{display:flex;align-items:center;gap:8px;background:#eeefed;border-radius:11px;padding:0 12px;height:42px;color:#6b6f76;font-size:14px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:7px 14px;border-radius:11px;font-size:13px;font-weight:500;border:1px solid #e7e9ec;background:#fff;color:#6b6f76}
  .chip.on{background:#111214;color:#fff;border-color:#111214;font-weight:700}
  .style-card{width:128px;border:1px solid #e7e9ec;background:#fff;border-radius:14px;padding:12px 14px}
  .style-card b{font-size:13px;display:block;color:#111214}
  .style-card span{font-size:11px;color:#6b6f76}
</style>
<div class="search">⌕&nbsp; 상품, 크리에이터, 스타일 검색</div>
<div class="chips">
  <span class="chip on">전체</span><span class="chip">패션</span><span class="chip">뷰티</span>
  <span class="chip">인테리어</span><span class="chip">테크</span><span class="chip">라이프</span>
</div>
<div style="display:flex;gap:8px">
  <div class="style-card"><b>미니멀</b><span>군더더기 없는 라인</span></div>
  <div class="style-card"><b>Quiet Luxury</b><span>절제된 고급감</span></div>
</div>
