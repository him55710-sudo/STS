<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;padding:24px;background:#f7f7f6;font:12px "Pretendard Variable",Pretendard,Inter,sans-serif;color:#111214;display:flex;gap:40px}
  h4{margin:0 0 10px;font-size:13px}
  .bar{background:#5b556e;height:10px;border-radius:3px;margin:6px 0}
  .lbl{color:#6b6f76;font-size:11px}
  .r{background:#fff;border:1px solid #e7e9ec;width:72px;height:52px;display:flex;align-items:center;justify-content:center;color:#6b6f76;font-size:11px;margin-bottom:8px}
</style>
<div style="flex:1">
  <h4>8pt Spacing Scale</h4>
  <div class="bar" style="width:4px"></div><span class="lbl">4</span>
  <div class="bar" style="width:8px"></div><span class="lbl">8</span>
  <div class="bar" style="width:16px"></div><span class="lbl">16</span>
  <div class="bar" style="width:24px"></div><span class="lbl">24</span>
  <div class="bar" style="width:40px"></div><span class="lbl">40</span>
  <div class="bar" style="width:64px"></div><span class="lbl">64</span>
</div>
<div>
  <h4>Border Radius</h4>
  <div class="r" style="border-radius:4px">4 tight</div>
  <div class="r" style="border-radius:10px">10 button</div>
  <div class="r" style="border-radius:14px">14 card</div>
  <div class="r" style="border-radius:22px 22px 0 0">22 sheet-top</div>
</div>
