<!-- @dsCard group="Colors" -->
<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;padding:24px;background:#f7f7f6;font:13px/1.5 "Pretendard Variable",Pretendard,Inter,-apple-system,sans-serif;color:#111214}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .sw{border:1px solid #e7e9ec;border-radius:12px;overflow:hidden;background:#fff}
  .chip{height:64px}
  .meta{padding:8px 10px}
  .meta b{display:block;font-size:12px}
  .meta span{font-size:11px;color:#6b6f76}
</style>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#f7f7f6"></div><div class="meta"><b>Off-White BG</b><span>#F7F7F6</span></div></div>
  <div class="sw"><div class="chip" style="background:#ffffff"></div><div class="meta"><b>Surface</b><span>#FFFFFF</span></div></div>
  <div class="sw"><div class="chip" style="background:#eeefed"></div><div class="meta"><b>Subtle Fill</b><span>#EEEFED</span></div></div>
  <div class="sw"><div class="chip" style="background:#e7e9ec"></div><div class="meta"><b>Border</b><span>#E7E9EC</span></div></div>
  <div class="sw"><div class="chip" style="background:#111214"></div><div class="meta"><b>Charcoal · Text</b><span>#111214</span></div></div>
  <div class="sw"><div class="chip" style="background:#6b6f76"></div><div class="meta"><b>Gray · Secondary</b><span>#6B6F76</span></div></div>
  <div class="sw"><div class="chip" style="background:#5b556e"></div><div class="meta"><b>Graphite Violet · Accent/CTA</b><span>#5B556E</span></div></div>
  <div class="sw"><div class="chip" style="background:#fee500"></div><div class="meta"><b>Kakao</b><span>#FEE500 · 로그인 전용</span></div></div>
</div>
